<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Ground (blush)","default":"#F7E4E8"},
    {"id":"color-paper","type":"color","label":"End card ground","default":"#FFFFFF"},
    {"id":"color-ink","type":"color","label":"Text","default":"#2B1B21"},
    {"id":"color-accent","type":"color","label":"Accent (cherry)","default":"#A11D44"},
    {"id":"font-display","type":"string","label":"Display font","default":"Baloo 2"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Sakhi · Tara · 45 s</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #f7e4e8;
        --color-paper: #ffffff;
        --color-ink: #2b1b21;
        --color-accent: #a11d44;
        --font-display: 'Baloo 2';
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Sakhi, 45 s: globe -> Bidar -> Tara -> the ASHA's check-in with Sakhi ->
         the danger sign caught -> the doctor in one tap -> the mother -> end card.
         Plan: SPEC.md and STORYBOARD.md. Every screen is the real app (assets/app). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <div id="s1-globe" class="clip" data-composition-id="s1-globe" data-composition-src="compositions/s1-globe.html" data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2-logo" class="clip" data-composition-id="s2-logo" data-composition-src="compositions/s2-logo.html" data-start="8" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3-asha" class="clip" data-composition-id="s3-asha" data-composition-src="compositions/s3-asha.html" data-start="11.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4-sakhi" class="clip" data-composition-id="s4-sakhi" data-composition-src="compositions/s4-sakhi.html" data-start="16" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5-catch" class="clip" data-composition-id="s5-catch" data-composition-src="compositions/s5-catch.html" data-start="25" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s6-doctor" class="clip" data-composition-id="s6-doctor" data-composition-src="compositions/s6-doctor.html" data-start="32" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s7-mother" class="clip" data-composition-id="s7-mother" data-composition-src="compositions/s7-mother.html" data-start="39" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s8-end" class="clip" data-composition-id="s8-end" data-composition-src="compositions/s8-end.html" data-start="41.5" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Sakhi's real recorded voice (the app's own lines, Gnani Kaveri) -->
      <audio id="vo-q06" class="clip" src="assets/voice/sakhi-q06.wav" data-start="16.6" data-duration="2.24" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-danger" class="clip" src="assets/voice/sakhi-danger.wav" data-start="25.8" data-duration="3.04" data-track-index="3" data-volume="1"></audio>

      <!-- soft sound design, no music (tools/make-sfx.py): air, taps, whooshes, the pin, the pulse, the resolve -->
      <audio id="sfx-air" class="clip" src="assets/sfx/air.wav" data-start="0" data-duration="8.0" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-dive" class="clip" src="assets/sfx/whoosh-dive.wav" data-start="1.2" data-duration="1.5" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-karnataka" class="clip" src="assets/sfx/whoosh-soft.wav" data-start="3.8" data-duration="0.6" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-pin" class="clip" src="assets/sfx/pin-pop.wav" data-start="6.2" data-duration="0.3" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-iris" class="clip" src="assets/sfx/whoosh-soft.wav" data-start="7.75" data-duration="0.6" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-logo" class="clip" src="assets/sfx/shimmer.wav" data-start="8.35" data-duration="1.4" data-track-index="5" data-volume="0.8"></audio>
      <audio id="sfx-tap1" class="clip" src="assets/sfx/tap.wav" data-start="12.75" data-duration="0.08" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-tap2" class="clip" src="assets/sfx/tap.wav" data-start="14.8" data-duration="0.08" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-card" class="clip" src="assets/sfx/whoosh-soft.wav" data-start="16.1" data-duration="0.6" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-pulse" class="clip" src="assets/sfx/pulse.wav" data-start="25.72" data-duration="1.0" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-carry" class="clip" src="assets/sfx/whoosh-soft.wav" data-start="32.3" data-duration="0.6" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-tap3" class="clip" src="assets/sfx/tap.wav" data-start="35.15" data-duration="0.08" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-tap4" class="clip" src="assets/sfx/tap.wav" data-start="37.0" data-duration="0.08" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh-whip.wav" data-start="39.0" data-duration="0.35" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-resolve" class="clip" src="assets/sfx/resolve.wav" data-start="41.95" data-duration="3.0" data-track-index="4" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
