    <div data-hf-id="hf-asq4" class="copy" id="c4"><div data-hf-id="hf-cyxa" class="kicker">Her own ASHA accepted</div><div data-hf-id="hf-th2s" class="line"><span data-hf-id="hf-w1rf" class="w">Help</span> <span data-hf-id="hf-fj2o" class="w">is</span> <span data-hf-id="hf-1ykb" class="w accent">3</span> <span data-hf-id="hf-snon" class="w accent">minutes</span> <span data-hf-id="hf-jasy" class="w">away</span></div><div data-hf-id="hf-ntvj" class="small-line">Sunita · 0.8 km away</div></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const T = { tap: 1.9, ov: 1.92, count: 2.1, alert: 5.1, come: 7.3 };
    const showWords = (sel, at) =>
      tl.fromTo(`${sel} .w`, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out', stagger: 0.06 }, at);
    const fadeIn = (sel, at, extra = {}) => tl.fromTo(sel, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power4.out', ...extra }, at);
    const clear = (sel, at) => tl.to(sel, { opacity: 0, filter: 'blur(8px)', duration: 0.18, ease: 'power3.in' }, at);

    // ---- 0.0 her home; the SOS tab breathes (SosTab: 1.6 s sine glow) ----
    tl.fromTo('#halo', { opacity: 0.25, scale: 1 }, { opacity: 0.6, scale: 1.12, duration: 0.8, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.2);
    fadeIn('#c1 .kicker', 0.1);
    showWords('#c1', 0.2);
    // 1.0 one tap (pressed: RED_DEEP)
    tl.fromTo('#touch', { opacity: 0, scale: 1 }, { opacity: 1, scale: 0.86, duration: 0.12, ease: 'power2.out' }, T.tap - 0.12);
    tl.fromTo('#tab-deep', { opacity: 0 }, { opacity: 1, duration: 0.06 }, T.tap - 0.06);
    tl.to('#touch', { opacity: 0, scale: 1, duration: 0.15, ease: 'power2.in' }, T.tap + 0.02);
    clear('#c1', T.tap + 0.05);

    // ---- 1.0 the overlay (FadeIn 180 ms) ----
    tl.fromTo('#ov', { opacity: 0 }, { opacity: 1, duration: 0.18, ease: 'none' }, T.ov);
    tl.fromTo('#p-count', { opacity: 0 }, { opacity: 1, duration: 0.01 }, T.ov);

    // ---- 1.2 countdown: 3, 2, 1 -- one beat a second (160 ms out, 840 ms back) ----
    tl.fromTo('#d3', { opacity: 0 }, { opacity: 1, duration: 0.01 }, T.ov);
    [0, 1, 2].forEach((k) => {
      tl.fromTo('#disc', { scale: 1 }, { scale: 1.07, duration: 0.16, ease: 'power1.out', immediateRender: false }, T.count + k);
      tl.to('#disc', { scale: 1, duration: 0.84, ease: 'power1.inOut' }, T.count + k + 0.16);
    });
    tl.set('#d3', { opacity: 0 }, T.count + 1); tl.set('#d2', { opacity: 1 }, T.count + 1);
    tl.set('#n3', { display: 'none' }, T.count + 1); tl.set('#n2', { display: 'inline' }, T.count + 1);
    tl.set('#d2', { opacity: 0 }, T.count + 2); tl.set('#d1', { opacity: 1 }, T.count + 2);
    tl.set('#n2', { display: 'none' }, T.count + 2); tl.set('#n1', { display: 'inline' }, T.count + 2);
    // ripples: three rings 600 ms apart, each 1.8 s (out-quad), until the alert goes
    [[0, 0], [1, 0.6], [2, 1.2], [3, 1.8], [4, 2.4]].forEach(([i, d]) => {
      tl.fromTo(`#ring${i}`, { opacity: 0.55, scale: 1 }, { opacity: 0, scale: 2.4, duration: 1.8, ease: 'power1.out' }, T.count + d);
    });
    tl.set('.ring', { opacity: 0 }, T.alert);
    fadeIn('#c2 .kicker', T.count + 0.1);
    showWords('#c2', T.count + 0.2);
    clear('#c2', T.alert - 0.2);

    // ---- 4.2 alerting: radar sweep (2.2 s a turn), wave 1 rows ----
    tl.set('#p-count', { opacity: 0 }, T.alert);
    tl.set('#p-alert', { opacity: 1 }, T.alert);
    tl.set('#d1', { opacity: 0 }, T.alert); tl.set('#dsos', { opacity: 1 }, T.alert);
    tl.set('#radar', { opacity: 1 }, T.alert);
    tl.fromTo('#beam', { rotation: 0 }, { rotation: ((T.come - T.alert) / 2.2) * 360, duration: T.come - T.alert, ease: 'none' }, T.alert);
    tl.fromTo('.a-row', { opacity: 0, y: -25 }, { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out', stagger: 0.09 }, T.alert);
    tl.set('#p-alert .c-alerting', { opacity: 1 }, T.alert);
    // "alerted" after 600 ms; "seen" one by one (app: 1.8 / 2.7 / 3.6 s, compressed)
    tl.set('#p-alert .c-alerting', { opacity: 0 }, T.alert + 0.6);
    tl.set('#p-alert .c-alerted', { opacity: 1 }, T.alert + 0.6);
    [0, 1, 2].forEach((i) => {
      const at = T.alert + 1.0 + i * 0.35;
      tl.set(`#p-alert .a-row:nth-child(${i + 1}) .c-alerted`, { opacity: 0 }, at);
      tl.fromTo(`#seen-${i}`, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'back.out(2)' }, at);
    });
    fadeIn('#c3 .kicker', T.alert + 0.1);
    showWords('#c3', T.alert + 0.2);
    clear('#c3', T.come - 0.2);

    // ---- 6.6 Sunita accepted: she is coming ----
    tl.set('#p-alert', { opacity: 0 }, T.come);
    tl.set('#p-come', { opacity: 1 }, T.come);
    tl.set('#dsos', { opacity: 0 }, T.come); tl.set('#dok', { opacity: 1 }, T.come);
    fadeIn('#c4 .kicker', T.come + 0.1);
    showWords('#c4', T.come + 0.2);
    fadeIn('#c4 .small-line', T.come + 0.5);

    window.__timelines['sos'] = tl;
  </script>
</template>
