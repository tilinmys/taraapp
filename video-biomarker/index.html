<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"cream","type":"color","label":"Cream ground","default":"#F7F0EB"},
    {"id":"plum","type":"color","label":"Deep plum","default":"#4A2238"},
    {"id":"mauve","type":"color","label":"Dusty mauve","default":"#B48A9B"},
    {"id":"blush","type":"color","label":"Blush pink","default":"#E9C7CF"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --cream: #f7f0eb;
        --plum: #4a2238;
        --mauve: #b48a9b;
        --blush: #e9c7cf;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* The one ground under both scenes: cream, a soft mauve sweep top-left
         and a blush wave bottom-right (after the reference still). */
      #ground {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: radial-gradient(ellipse 70% 60% at 62% 45%, #fbf6f2 0%, var(--cream) 60%, #f1e5df 100%);
      }
      #ground svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="ground" class="clip" data-start="0" data-duration="10" data-track-index="0" data-layout-ignore>
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#c9a3b3" stop-opacity="0.55" />
              <stop offset="1" stop-color="#e9c7cf" stop-opacity="0.12" />
            </linearGradient>
            <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#e9c7cf" stop-opacity="0" />
              <stop offset="0.55" stop-color="#d9aebb" stop-opacity="0.45" />
              <stop offset="1" stop-color="#8e5a73" stop-opacity="0.55" />
            </linearGradient>
          </defs>
          <path d="M0 0 H760 C640 120 470 210 300 330 C190 410 90 470 0 500 Z" fill="url(#sweep)" />
          <path d="M1920 640 C1720 760 1500 860 1180 1080 H1920 Z" fill="url(#wave)" />
        </svg>
      </div>

      <div
        id="screening"
        data-composition-id="screening"
        data-composition-src="compositions/screening.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="referral"
        data-composition-id="referral"
        data-composition-src="compositions/referral.html"
        data-start="6"
        data-duration="4"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
