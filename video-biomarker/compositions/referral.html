    // the referral line runs from the result to the hospital

    tl.fromTo(path, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.85, ease: "power2.inOut" }, 1.05);

    tl.fromTo("#s2-end-ring", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    tl.fromTo("#s2-end-ring", { scale: 1, opacity: 0.8, transformOrigin: "50% 50%" }, { scale: 3.2, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 1.95);
