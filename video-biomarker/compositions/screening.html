  <script>
    const tl = gsap.timeline({ paused: true });
    const blurIn = (sel, at, dur = 0.22) =>
      tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: dur, ease: "power4.out" }, at);
    const blurOut = (sel, at, dur = 0.2) =>
      tl.fromTo(sel, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: dur, ease: "power2.in", immediateRender: false }, at);

    // 0.0 the device arrives (a slow settle, no movement after it lands)
    tl.fromTo("#s1-cam", { opacity: 0, scale: 1.05, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 1.1, ease: "expo.out", transformOrigin: "600px 540px" }, 0);
    tl.fromTo("#s1-counter", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

    // title 1, line by line
    blurIn("#s1-a1", 0.35);
    blurIn("#s1-a2", 0.47, 0.26);
    blurIn("#s1-a3", 0.6);
    tl.fromTo("#s1-a-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.75);

    // the screen starts on "Ready for test"
    tl.fromTo("#s1-ready", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
    tl.fromTo(["#s1-analysing", "#s1-result"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

    // the dropper comes down, a drop forms and falls into the sample well
    tl.fromTo("#s1-pipette", { y: -480, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.9);
    tl.fromTo("#s1-drop", { scale: 0, opacity: 0, transformOrigin: "50% 0%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 1.55);
    tl.fromTo("#s1-drop", { y: 0 }, { y: 44, duration: 0.24, ease: "power2.in", immediateRender: false }, 1.9);
    tl.to("#s1-drop", { opacity: 0, duration: 0.05 }, 2.14);
    tl.fromTo("#s1-spot", { scale: 0.2, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 2.14);
    tl.fromTo("#s1-pipette", { y: 0 }, { y: -480, opacity: 0, duration: 0.45, ease: "power3.in", immediateRender: false }, 2.25);

    // the device reads the sample
    blurOut("#s1-ready", 2.35, 0.16);
    blurIn("#s1-analysing", 2.45, 0.16);
    tl.fromTo("#s1-progress", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power1.inOut" }, 2.5);

    // title 1 leaves; the result arrives
    blurOut("#s1-title-a", 3.35);
    blurOut("#s1-analysing", 3.52, 0.14);
    blurIn("#s1-result", 3.6, 0.18);
    tl.fromTo("#s1-gauge-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 3.7);
    tl.fromTo("#s1-gauge-mark", { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: "back.out(1.6)" }, 4.05);
    tl.fromTo("#s1-pill", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 4.2);
    // the subtle alert: one soft ring, once
    tl.fromTo("#s1-ring", { scale: 1, opacity: 0.85 }, { scale: 3.2, opacity: 0, duration: 0.9, ease: "power2.out" }, 4.4);

    // title 2
    blurIn("#s1-b1", 3.8);
    blurIn("#s1-b2", 3.92, 0.26);
    tl.fromTo("#s1-b-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 4.1);
    blurOut("#s1-title-b", 5.15);

    // the result card leaves the device and comes to the viewer (it becomes the next scene)
    tl.fromTo("#s1-screen", { x: 0, y: 0, scale: 1 }, { x: 360, y: 105, scale: 2.2, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 5.25);
    tl.fromTo(
      ["#s1-device > svg", "#s1-spot", "#s1-counter"],
      { opacity: 1, filter: "blur(0px)" },
      { opacity: 0, filter: "blur(14px)", duration: 0.45, ease: "power2.in", immediateRender: false },
      5.25,
    );

    window.__timelines["screening"] = tl;
  </script>
