# Redirect HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 3.109.104.193 3.109.104.193.nip.io _;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 3.109.104.193 3.109.104.193.nip.io _;

    ssl_certificate     /etc/letsencrypt/live/3.109.104.193.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.109.104.193.nip.io/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 16M;

    # Liveness only - the one status route that stays public, so an external
    # uptime monitor can check the worker without a password. Returns
    # worker readiness, no patient data.
    location = /status/health {
        auth_basic              off;
        proxy_pass              http://127.0.0.1:8080/health;
        proxy_set_header        Host $host;
    }

    # Public, anonymised, aggregate counters (UNICEF Innovation Fund: publicly
    # exposed real-time data). Counts only, small counts suppressed
    # (status_server.public_metrics); no patient-level data. Public on purpose.
    location = /status/public/metrics {
        auth_basic              off;
        proxy_pass              http://127.0.0.1:8080/public/metrics;
        proxy_set_header        Host $host;
    }

    # Status server proxy. Was `auth_basic off` - confirmed 2026-09-24 that
    # made /status/reports, /status/logs, /status/events and the MCP cards
    # (patient ids, risk levels, transcripts) readable by anyone with the
    # URL, and POST /status/reports/flag writable. Now behind the SAME realm
    # and password file as the dashboard: the browser already holds those
    # credentials for this origin, so the dashboard's own EventSource and
    # fetch calls keep working with no frontend change.
    location /status/ {
        auth_basic              "Sakhi Portal";
        auth_basic_user_file    /etc/nginx/.htpasswd;
        proxy_pass              http://127.0.0.1:8080/;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_set_header        Connection '';
        chunked_transfer_encoding on;
    }

    # Next.js app + WebSocket support
    location / {
        auth_basic           "Sakhi Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass           http://127.0.0.1:3000;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade $http_upgrade;
        proxy_set_header     Connection "upgrade";
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   86400;
    }
}
